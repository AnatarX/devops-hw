---
- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ deployer_user }}"
    group: "{{ deployer_user }}"
    mode: "0755"

- name: Copy Docker Compose project
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/"
    dest: "{{ app_dir }}/"
    owner: "{{ deployer_user }}"
    group: "{{ deployer_user }}"
    mode: "u=rwX,g=rX,o=rX"
  notify: Restart app

- name: Start containers (docker compose up -d)
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    state: present
    wait: true
    wait_timeout: 120

- name: Check that proxy serves the page
  ansible.builtin.uri:
    url: http://127.0.0.1/
    return_content: true
  register: app_response
  failed_when: "'Hello World' not in app_response.content"
  changed_when: false
