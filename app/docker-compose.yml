name: app

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
      - backend
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  app:
    image: nginx:1.27-alpine
    volumes:
      - ./html:/usr/share/nginx/html:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

networks:
  frontend:
  backend:
    internal: true
